name: KINGAI OPS Public Install Smoke

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'update.sh'
      - 'uninstall.sh'
      - '.github/workflows/install-smoke.yml'
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: kingai-ops-public-install-smoke
  cancel-in-progress: false

jobs:
  one-click-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute the public one-command installer
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/kingaiwork/kingaiopsfree/main/install.sh | sudo env KINGAI_SKIP_SERVICE=1 sh
      - name: Verify installed binary and first-deploy artifacts
        shell: bash
        run: |
          set -euo pipefail
          require_file(){
            path="$1"
            if ! sudo test -s "$path"; then echo "::error::Missing or empty first-deploy artifact: $path"; exit 1; fi
            sudo stat -c '%a %U:%G %s %n' "$path"
          }
          require_mode(){
            path="$1" expected="$2"
            actual="$(sudo stat -c '%a' "$path")"
            if [ "$actual" != "$expected" ]; then echo "::error::Unexpected mode for $path: $actual (expected $expected)"; exit 1; fi
          }
          sudo /usr/local/bin/kingai version
          sudo /usr/local/bin/kingai admin status | tee /tmp/admin-status.json
          grep -q '"configured": true' /tmp/admin-status.json || { echo '::error::Local administrator was not configured'; exit 1; }
          require_file /etc/kingaiops/admin.json
          require_mode /etc/kingaiops/admin.json 600
          require_file /var/lib/kingaiops/baseline.json
          require_file /var/lib/kingaiops/reports/first-security-check.json
          require_file /var/lib/kingaiops/initial-admin.txt
          require_mode /var/lib/kingaiops/initial-admin.txt 600
          if ! sudo /usr/local/bin/kingai health >/tmp/health.json; then
            echo '::error::kingai health returned non-zero'
            cat /tmp/health.json || true
            exit 1
          fi
          test -s /tmp/health.json || { echo '::error::kingai health returned an empty document'; exit 1; }
          grep -q '"status"' /tmp/health.json || { echo '::error::Health JSON has no status'; cat /tmp/health.json; exit 1; }
      - name: Validate public release checksum directly
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/kingaiwork/kingaiopsfree/releases/latest/download'
          curl --proto '=https' --tlsv1.2 -fsSL "$base/SHA256SUMS" -o /tmp/SHA256SUMS
          curl --proto '=https' --tlsv1.2 -fsSL "$base/kingai-linux-amd64" -o /tmp/kingai-linux-amd64
          expected="$(awk '$2=="kingai-linux-amd64"{print $1}' /tmp/SHA256SUMS)"
          actual="$(sha256sum /tmp/kingai-linux-amd64 | awk '{print $1}')"
          test -n "$expected" || { echo '::error::amd64 checksum missing from SHA256SUMS'; exit 1; }
          test "$expected" = "$actual" || { echo '::error::Public amd64 binary checksum mismatch'; exit 1; }
          echo "PUBLIC_RELEASE_SHA256_VERIFIED $actual"
      - name: Clean ephemeral runner
        if: always()
        run: |
          sudo sh uninstall.sh || true
          sudo rm -rf /etc/kingaiops /var/lib/kingaiops /var/log/kingaiops
