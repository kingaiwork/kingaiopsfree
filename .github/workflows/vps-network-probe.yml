name: VPS Network Probe

on:
  push:
    paths:
      - '.github/workflows/vps-network-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe VPS ports
        run: |
          host=147.135.113.65
          echo "UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "TARGET=$host"
          for port in 22 58888 80 443 6080 18789; do
            if timeout 5 bash -c "</dev/tcp/$host/$port" 2>/dev/null; then
              echo "TCP $port OPEN"
            else
              echo "TCP $port CLOSED_OR_FILTERED"
            fi
          done
          echo "SSH_22_BANNER_BEGIN"
          timeout 5 bash -c "exec 3<>/dev/tcp/$host/22; head -c 200 <&3" 2>&1 || true
          echo "SSH_22_BANNER_END"
          echo "SSH_58888_BANNER_BEGIN"
          timeout 5 bash -c "exec 3<>/dev/tcp/$host/58888; head -c 200 <&3" 2>&1 || true
          echo "SSH_58888_BANNER_END"
          echo "PROBE_COMPLETE"
          exit 1
