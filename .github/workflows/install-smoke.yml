name: KINGAI OPS Public Install Smoke Zero-Bill

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'update.sh'
      - 'uninstall.sh'
      - '.github/workflows/install-smoke.yml'
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: kingai-ops-public-install-smoke
  cancel-in-progress: true

jobs:
  one-click-install:
    runs-on: [self-hosted, linux, x64, kingai-vps]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require isolated local container runtime
        shell: bash
        run: |
          set -euo pipefail
          docker --version
          sh -n install.sh
          sh -n update.sh
          sh -n uninstall.sh
          mkdir -p /srv/kingai/qa/kingaiopsfree/${GITHUB_SHA}

      - name: Validate bootstrap profiles without host mutation
        shell: bash
        run: |
          set -euo pipefail
          sh install.sh --help | grep -q 'Universal Bootstrap v2'
          for profile in server edge iot minimal; do
            output="$(sh install.sh --profile "$profile" --dry-run)"
            echo "$output"
            grep -q "PROFILE=$profile" <<<"$output"
            grep -q 'Dry run complete; no files were changed.' <<<"$output"
          done

      - name: Execute real install smoke inside disposable Ubuntu container
        shell: bash
        run: |
          set -euo pipefail
          repo="$PWD"
          out="/srv/kingai/qa/kingaiopsfree/${GITHUB_SHA}"
          docker run --rm \
            -v "$repo:/repo:ro" \
            -v "$out:/evidence" \
            ubuntu:24.04 bash -lc '
              set -euo pipefail
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl coreutils procps >/dev/null
              cp -a /repo /work
              cd /work
              sh ./install.sh --profile server --no-service
              /usr/local/bin/kingai version | tee /evidence/version.txt
              /usr/local/bin/kingai admin status | tee /evidence/admin-status.json
              test -s /etc/kingaiops/admin.json
              test "$(stat -c %a /etc/kingaiops/admin.json)" = 600
              test -s /etc/kingaiops/install-meta.json
              grep -q '"schemaVersion": 2' /etc/kingaiops/install-meta.json
              test -s /var/lib/kingaiops/baseline.json
              test -s /var/lib/kingaiops/reports/first-security-check.json
              test -s /var/lib/kingaiops/initial-admin.txt
              /usr/local/bin/kingai health | tee /evidence/health.json
              sh ./uninstall.sh || true
            '
          find "$out" -type f -maxdepth 1 -print0 | sort -z | xargs -0 -r sha256sum > "$out/SHA256SUMS"

      - name: Validate currently published public release checksum read-only
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/kingaiwork/kingaiopsfree/releases/latest/download'
          curl --proto '=https' --tlsv1.2 -fsSL "$base/SHA256SUMS" -o /tmp/SHA256SUMS
          curl --proto '=https' --tlsv1.2 -fsSL "$base/kingai-linux-amd64" -o /tmp/kingai-linux-amd64
          expected="$(awk '$2=="kingai-linux-amd64"{print $1}' /tmp/SHA256SUMS)"
          actual="$(sha256sum /tmp/kingai-linux-amd64 | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$actual"
          printf '%s  %s\n' "$actual" kingai-linux-amd64 > "/srv/kingai/qa/kingaiopsfree/${GITHUB_SHA}/published-release.sha256"
